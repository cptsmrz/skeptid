services:
  - type: web
    name: skeptid
    runtime: python
    buildCommand: pip install -r requirements.lock && pip install -e .
    startCommand: PYTHONPATH=src uvicorn skeptid.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: SKEPTID_MODE
        value: live
      - key: PYTHONPATH
        value: src
