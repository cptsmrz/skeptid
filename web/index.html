<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKEPTID — Verify Before You Trust</title>
  <meta name="description" content="Drop any photo, video, audio, message, or file to check if it's real or fake.">
  <link rel="stylesheet" href="hub.css">
</head>
<body class="theme-glassmorphism">
  <!-- Looping Background Video -->
  <div class="bg-video-container" aria-hidden="true">
    <video class="bg-video-dark" autoplay muted loop playsinline preload="auto" poster="assets/hero-poster.jpg" aria-hidden="true">
      <source src="assets/hero.mp4" type="video/mp4">
    </video>
    <video class="bg-video-light" autoplay muted loop playsinline preload="auto" poster="assets/hero-light-poster.jpg" aria-hidden="true">
      <source src="assets/hero-light.mp4" type="video/mp4">
    </video>
  </div>
  <div class="bg-scrim" aria-hidden="true"></div>
  <div class="ambient-vignette" aria-hidden="true"></div>

  <!-- Hub Header -->
  <header class="hub-header">
    <a href="landing.html" class="hub-brand" aria-label="Go to SKEPTID Home">
      <div class="hub-title-group">
        <h1>SKEPTID</h1>
        <div class="hub-subtitle">Check Anything</div>
      </div>
    </a>

    <div class="hub-actions">
      <!-- Accurate Top Bar Home Navigation -->
      <a href="landing.html" class="hub-nav-link" aria-label="Home page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </a>

      <!-- Brushed Steel iOS Dark / Light Toggle Switch -->
      <button type="button" class="ios-steel-switch" id="ops-theme-toggle" role="switch" aria-label="Switch between Dark and Light mode">
        <span class="switch-thumb" aria-hidden="true"></span>
        <span class="switch-track">
          <span class="switch-option opt-dark">Dark</span>
          <span class="switch-option opt-light">Light</span>
        </span>
      </button>
    </div>
  </header>

  <!-- Centered Chromium New Tab Stage -->
  <main class="ntp-viewport">
    <div class="ntp-hero-brand">
      <h2 class="ntp-hero-title">Doubt it. Then <em>verify</em> it.</h2>
      <p class="ntp-hero-desc">Paste or drop anything here. We'll tell you if it's real.</p>
    </div>

    <!-- Centered Input / Drop Box -->
    <div class="ntp-input-box" id="ntp-drop-box" tabindex="0" role="region" aria-label="Drop zone">
      <svg class="ntp-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>

      <div class="ntp-prompt-main">Drop any file or paste text here</div>
      <div class="ntp-prompt-sub">Photos, videos, voice clips, emails, and documents</div>

      <textarea id="ntp-text-input" class="ntp-textarea" placeholder="Or paste suspicious message text, email content, or link here..."></textarea>

      <input type="file" id="ntp-file-input" hidden>

      <div class="ntp-btn-row">
        <button type="button" class="btn-secondary" id="ntp-choose-btn">Choose File</button>
        <button type="button" class="btn-primary" id="ntp-analyze-btn">Check Now</button>
      </div>

      <div class="ntp-file-name" id="ntp-file-name"></div>
      <div class="ntp-limits-tag">Instant check · Real evidence you can see</div>
    </div>

    <!-- Chromium NTP Style Shortcuts Row -->
    <nav class="ntp-shortcuts-container" aria-label="Tool Checkers">
      <a href="audio.html" class="ntp-tile">
        <div class="ntp-tile-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
        </div>
        <span class="ntp-tile-label">Voice</span>
      </a>

      <a href="image.html" class="ntp-tile">
        <div class="ntp-tile-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <span class="ntp-tile-label">Photo</span>
      </a>

      <a href="video.html" class="ntp-tile">
        <div class="ntp-tile-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        </div>
        <span class="ntp-tile-label">Video</span>
      </a>

      <a href="files.html" class="ntp-tile">
        <div class="ntp-tile-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <span class="ntp-tile-label">Files & Messages</span>
      </a>
    </nav>

    <!-- Results Panel -->
    <div class="ntp-result-panel" id="ntp-result-panel" hidden></div>
  </main>

  <script src="hub.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Auto-detect modality on omni hub based on file extension
      const fileInput = document.getElementById('ntp-file-input');
      let detectedModality = 'media';

      function updateModalityFromFile(file) {
        if (!file) return;
        const name = file.name.toLowerCase();
        if (name.endsWith('.wav') || name.endsWith('.mp3') || name.endsWith('.ogg') || name.endsWith('.flac')) {
          detectedModality = 'audio';
        } else if (name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png') || name.endsWith('.webp')) {
          detectedModality = 'image';
        } else if (name.endsWith('.mp4') || name.endsWith('.webm') || name.endsWith('.avi')) {
          detectedModality = 'video';
        } else if (name.endsWith('.eml') || name.endsWith('.txt')) {
          detectedModality = 'text';
        } else {
          detectedModality = 'binary';
        }
      }

      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          updateModalityFromFile(e.target.files[0]);
        }
      });

      window.SkeptidDesk.init({
        get modality() {
          const txt = document.getElementById('ntp-text-input');
          if (txt && txt.value.trim().length > 0 && (!fileInput.files || fileInput.files.length === 0)) {
            return 'text';
          }
          return detectedModality;
        }
      });
    });
  </script>
</body>
</html>
